name: Check public portfolio
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build and validate public output
        run: python3 scripts/check_site.py
      - name: Check navigation syntax
        run: node --check js/portfolio.js
      - uses: actions/upload-artifact@v4
        with:
          name: hostinger-public-site
          path: dist/
          include-hidden-files: true
